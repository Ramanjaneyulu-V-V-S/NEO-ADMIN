# ─── Logging Configuration ─────────────────────────────────────────
logging.level.root=INFO
logging.level.com.example.backend.service.RajbhashaService=INFO
logging.level.com.example.backend.controller.RajbhashaController=INFO
# Relative paths resolve against the server process working directory (e.g.
# $CATALINA_HOME/bin under an external Tomcat) — set NEOADMIN_LOG_DIR to an
# absolute path in deployment.
logging.file.name=${NEOADMIN_LOG_DIR:Reports Queries}/rajbhasha.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=10
logging.logback.rollingpolicy.total-size-cap=100MB
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
