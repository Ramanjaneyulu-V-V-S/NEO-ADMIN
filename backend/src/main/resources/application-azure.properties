# ─── Azure Environment Configuration ─────────────────────────────────────────

# Documentum REST
dctm.rest.url=https://172.172.20.214:3030/dctm-rest
dctm.rest.repository=NABARDUAT
dctm.rest.username=dmadmin
dctm.rest.password=Sedin@123456
dctm.rest.service-username=${DCTM_SERVICE_USERNAME:dmadmin}
dctm.rest.service-password=${DCTM_SERVICE_PASSWORD:Sedin@123456}

# OTDS REST API
otds.url=http://172.172.20.214:7070/otdsws/rest
otds.username=otadmin@otds.admin
otds.password=Sedin@123456

# OTDS Token API (for frontend authentication)
otds.token-api-url=http://172.172.20.214/proxy/otds/Integration/otds-proxy/token

# Tasklist API (DCTM workflow inbox)
tasklist.url=http://172.172.20.214/service
tasklist.cms-inbox-url=http://172.172.20.214/service/tasklist-queries
# Process Service (xCP stateless processes)
process.service.url=http://172.172.20.214/service

# Mail (SMTP)
spring.mail.host=${MAIL_SMTP_HOST:smtp.example.com}
spring.mail.port=${MAIL_SMTP_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
app.mail.from=${MAIL_FROM:noreply@nabard.org}

# ─── Logging Configuration ─────────────────────────────────────────
logging.level.root=INFO
logging.level.com.example.backend.service.RajbhashaService=INFO
logging.level.com.example.backend.controller.RajbhashaController=INFO
# Relative paths resolve against the server process working directory (e.g.
# $CATALINA_HOME/bin under an external Tomcat) — set NEOADMIN_LOG_DIR to an
# absolute path in deployment.
logging.file.name=${NEOADMIN_LOG_DIR:Reports Queries}/rajbhasha.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=10
logging.logback.rollingpolicy.total-size-cap=100MB
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
