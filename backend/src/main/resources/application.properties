spring.application.name=backend

# ─── Active Profile ────────────────────────────────────────────────────────────
# Switch to 'uat' or 'prod' when deploying to those environments.
# Override at runtime:  java -jar app.jar --spring.profiles.active=uat
spring.profiles.active=azure

# ─── App-level Configuration (shared across all environments) ─────────────────

# Workflow: Process Template IDs (r_object_id of dm_process)
app.workflow.processes=4b02cba08000624a

# Cases: default months to load when no search term is provided
app.cases.default-load-months=3

# Mail — display name for outgoing emails
app.mail.from-name=NB Support Admin Team
