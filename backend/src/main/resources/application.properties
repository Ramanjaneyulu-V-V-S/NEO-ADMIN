spring.application.name=backend

# ─── Active Profile ────────────────────────────────────────────────────────────
# Switch to 'uat', 'prod', or 'azure' depending on the target environment.
# Override at runtime:  java -jar app.jar --spring.profiles.active=azure
spring.profiles.active=prod

# ─── App-level Configuration (shared across all environments) ─────────────────

# Workflow: Process Template IDs (r_object_id of dm_process)
app.workflow.processes=4b02cba08000624a

# Cases: default months to load when no search term is provided
app.cases.default-load-months=3

# Mail — display name for outgoing emails
app.mail.from-name=NB Support Admin Team

# SFS Configuration — folder ID for SFS metadata objects
# Get r_object_id from: SELECT r_object_id FROM dm_folder WHERE ANY r_folder_path = '/SFS Config/Document Type'
app.sfs.document-type-folder-id=0b02cba080140d1e

# ─── OTDS Token API (overridden in environment-specific files) ──────────────────
# This URL is returned to frontend for authentication
# Each environment file (application-prod.properties, application-uat.properties, etc.)
# should override this with their respective OTDS token endpoint
otds.token-api-url=http://172.172.20.214/proxy/otds/Integration/otds-proxy/token
